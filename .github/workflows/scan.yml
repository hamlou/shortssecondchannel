name: scan
run-name: scan ${{ inputs.shorts }}

# Footage-first scripting: contact sheets of a whole source video (1 tile / 3 s, stamped m:ss).
# Source decrypted only on the runner; sheets leave encrypted (key = secret SRC_KEY).
on:
  workflow_dispatch:
    inputs:
      shorts:
        description: Short numbers, space separated (e.g. 02 03 04)
        required: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      SRC_KEY: ${{ secrets.SRC_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: ffmpeg
        run: |
          curl -sSL -o /tmp/ff.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
          mkdir -p /opt/ff && tar -xJf /tmp/ff.tar.xz -C /opt/ff --strip-components=1
          echo /opt/ff/bin >> $GITHUB_PATH
      - name: Sheets
        run: |
          mkdir -p out
          FONT=$PWD/tools/fonts/FredokaBold.ttf
          for S in ${{ inputs.shorts }}; do
            gh release download src-$S -p source.mp4.enc -D /tmp --clobber
            openssl enc -d -aes-256-cbc -pbkdf2 -pass env:SRC_KEY -in /tmp/source.mp4.enc -out /tmp/src.mp4
            rm /tmp/source.mp4.enc
            mkdir -p /tmp/sc
            ffmpeg -v error -i /tmp/src.mp4 -vf "fps=1/3,scale=200:-2,drawtext=fontfile=$FONT:text='%{pts\:hms}':x=3:y=2:fontsize=14:fontcolor=yellow:box=1:boxcolor=black@0.8,tile=10x8" /tmp/sc/scan_%02d.jpg
            for f in /tmp/sc/*.jpg; do openssl enc -aes-256-cbc -pbkdf2 -pass env:SRC_KEY -in $f -out out/${S}_$(basename $f).enc; done
            rm -rf /tmp/sc /tmp/src.mp4
            echo "$S done"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: scan
          path: out
          retention-days: 3
