name: short
run-name: short S${{ inputs.short }}

# Builds one Short end to end on the runner (the owner's PC only downloads the source, see tools/send_source.sh).
# Third-party footage only exists here ENCRYPTED (release asset src-<nn>, key = secret SRC_KEY); the finished Short
# leaves the runner encrypted too. Fails if the monetization gate (tools/mono_check.py) fails.
on:
  workflow_dispatch:
    inputs:
      short:
        description: Short number (e.g. 02)
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      S: ${{ inputs.short }}
      FFMPEG: ffmpeg
      SRC_KEY: ${{ secrets.SRC_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: ffmpeg (current static build, same behaviour as the PC's 9.x)
        run: |
          curl -sSL -o /tmp/ff.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
          mkdir -p /opt/ff && tar -xJf /tmp/ff.tar.xz -C /opt/ff --strip-components=1
          echo /opt/ff/bin >> $GITHUB_PATH
          /opt/ff/bin/ffmpeg -version | head -1
      - run: pip install -q kokoro-onnx soundfile numpy pillow
      - uses: actions/cache@v4
        with:
          path: tools/voice
          key: kokoro-v1.0-int8
      - name: Voice model (Kokoro-82M, Apache 2.0)
        run: |
          mkdir -p tools/voice
          for f in kokoro-v1.0.int8.onnx voices-v1.0.bin; do
            [ -f tools/voice/$f ] || curl -sSL -o tools/voice/$f https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/$f
          done
      - name: Source (decrypt)
        run: |
          mkdir -p shorts/$S/source
          gh release download src-$S -p source.mp4.enc -D /tmp
          openssl enc -d -aes-256-cbc -pbkdf2 -pass env:SRC_KEY -in /tmp/source.mp4.enc -out shorts/$S/source/source.mp4
          rm /tmp/source.mp4.enc
      - name: Source frame sheet (verify shots)
        run: mkdir -p shorts/$S/build && python tools/src_sheet.py shorts/$S
      - name: Voice-over
        run: python tools/tts.py shorts/$S/script.json
      - name: Monetization gate
        run: python tools/mono_check.py shorts/$S/script.json --durations shorts/$S/durations.json | tee gate.txt
      - name: Music bed
        run: python tools/musicbed.py $((10#$S))
      - uses: actions/cache@v4
        with:
          path: shorts/${{ inputs.short }}/build/ai
          key: ai-${{ inputs.short }}-${{ hashFiles(format('shorts/{0}/script.json', inputs.short)) }}
          restore-keys: ai-${{ inputs.short }}-
      - name: AI beauty stills (Cloudflare Workers AI, FLUX.1-schnell, Apache 2.0)
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          python tools/ai_gen.py shorts/$S
          ffmpeg -v error -y -pattern_type glob -i "shorts/$S/build/ai/*.jpg" -vf "scale=256:256,tile=6x4" -frames:v 1 ai_sheet.jpg
      - name: Assemble
        run: python tools/assemble.py shorts/$S
      - name: Pacing check
        run: python tools/pace_check.py shorts/$S | tee pace.txt
      - name: Encrypt outputs
        run: |
          mkdir -p out
          for f in final.mp4 final_sheet.jpg src_sheet.jpg; do
            openssl enc -aes-256-cbc -pbkdf2 -pass env:SRC_KEY -in shorts/$S/build/$f -out out/$f.enc
          done
          cp shorts/$S/durations.json shorts/$S/build/plan.json gate.txt pace.txt ai_sheet.jpg out/
      - uses: actions/upload-artifact@v4
        with:
          name: short-${{ inputs.short }}
          path: out
          retention-days: 7
